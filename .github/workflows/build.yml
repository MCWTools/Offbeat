name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          NAME="Offbeat-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Offbeat-apk
          path: ${{ env.APK_NAME }}

      # Push a tag like v1.0.0 -> a GitHub Release with the APK attached
      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
